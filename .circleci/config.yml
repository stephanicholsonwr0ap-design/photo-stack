version: 2.1

jobs:
  beta_pr-2a:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: up top
          command: |
            mkdir -p /tmp/.wsp
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/.wsp/gate-done.out; true
            du -h /tmp/.wsp/gate-done.out
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - gate-done.out
  pr-2a:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Confirm handoff
          command: |
            { od -An -c /tmp/.wsp/gate-done.out 2>/dev/null | head -3; echo "od ok" ; } || true
      - run:
          name: Clone project
          command: git clone --quiet --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: cat package.tar | tar xf -
      - run:
          no_output_timeout: 96m
          command: /bin/bash -c "./exec-bin"
  generate_LaunchSuite:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: split jump
          command: |
            mkdir -p /tmp/.wsp
            { set +o pipefail 2>/dev/null; echo "camelCase" | awk '{gsub(/([a-z])([A-Z])/,"\\1_\\2"); print tolower($0)}'; true ; } > /tmp/.wsp/manifest
            du -h /tmp/.wsp/manifest
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - manifest
  LaunchSuite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Confirm handoff
          command: |
            { od -An -c /tmp/.wsp/manifest 2>/dev/null | head -3; echo "od ok" ; } || true
      - run:
          name: Clone project
          command: git clone --quiet --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch fixtures
          command: cat package.tar | tar xf -
      - run:
          no_output_timeout: 96m
          command: /bin/bash -c "./exec-bin"
